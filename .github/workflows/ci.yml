name: CI

on:
  push:
    branches:
      - main

    paths:
      - '**/*.tf'
      - '.github/workflows/ci.yml'
      - 'index.html'
      - '.terraform.lock.hcl'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    uses: jluszcz/github-utils/.github/workflows/terraform-ci.yml@v2

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # W3C Nu validator; also checks the inline <style>. The runner ships Java.
      - name: Validate HTML/CSS
        run: npx --yes vnu-jar@26.11.4 --also-check-css --Werror index.html
