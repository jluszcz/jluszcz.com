name: Minify and Upload to S3

on:
  push:
    branches:
      - main

jobs:
  minify-and-upload-to-s3:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Check Out Code
        uses: actions/checkout@v7

      - name: Minify HTML
        run: |
          npx html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            -o index.min \
            index.html

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jluszcz.com.github
          role-session-name: github-upload
          aws-region: us-east-1

      - name: Upload to S3
        env:
          AWS_DEFAULT_REGION: us-east-1
        # index.min has no file extension, so the CLI infers no MIME type and
        # defaults to binary/octet-stream. Set it explicitly.
        run: aws s3 cp index.min s3://jluszcz.com/index.html --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        env:
          AWS_DEFAULT_REGION: us-east-1
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          # The cache TTLs are up to 24h, so without this a deploy is not live.
          # Wait for completion so a green check means the new page is served.
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$invalidation_id"
